<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player -Enjoy</title>
     <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
     <div class="container">
       <div class="music-player">
         <nav>
            <div class="circle">
            <i class="fa-solid fa-chevron-left"></i>
            </div>
            <div class="circle">
            <i class="fa-solid fa-bars"></i>
            </div>
         </nav>
         <img src="karan.jpg" alt="image" id="img">
         <h3>Take It Easy</h3>
         <p>Karan Aujla Ft.Ikky</p>
         <audio id="song">
        <source src="son.mp3" type="audio/mpeg">
         </audio>
         <input type="range" value="0" id="progress">
         <div class="controls">
            <div class="buticon"><i class="fa-solid fa-backward"></i></div>
            <div class="buticon2" onclick="change()"><i class="fa-solid fa-play" id="ctrlIcon"></i></div>
            <div class="buticon"><i class="fa-solid fa-forward"></i></div>
         </div>
       </div>
     </div>
 <script src="script.js"></script>
</body>
</html>
